name: Submit browser extension to stores
run-name: "${{ inputs.dry_run && 'Check' || 'Submit' }} ${{ inputs.tag }} — ${{ inputs.store }}"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub Release tag (vX.Y.Z)
        required: true
        type: string
      store:
        description: Stores to submit to
        required: true
        type: choice
        default: all
        options: [all, chrome, edge, firefox]
      dry_run:
        description: Check artifacts and credentials without uploading (Edge credentials are not checked)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    name: Verify existing release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      stores: ${{ steps.plan.outputs.stores }}
    steps:
      - name: Require the main workflow branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24.18.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate inputs
        id: plan
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          STORE_SELECTION: ${{ inputs.store }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/store-release.mjs plan
      - name: Download the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          mkdir -p artifacts
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease > artifacts/release.json
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir artifacts \
            --pattern "motrix-extension-$VERSION-chrome-edge.zip" \
            --pattern "motrix-extension-$VERSION-firefox.zip" \
            --pattern "motrix-extension-$VERSION-source.zip" \
            --pattern SHA256SUMS.txt
      - name: Verify release before distributing assets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/store-release.mjs verify artifacts "$RELEASE_TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-store-assets
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  submit:
    name: "${{ matrix.store }} — ${{ inputs.dry_run && 'check' || 'submit' }}"
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        store: ${{ fromJSON(needs.prepare.outputs.stores) }}
    # Serialize all versions for a store; never interrupt an active submission.
    concurrency:
      group: store-submit-${{ github.repository }}-${{ matrix.store }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24.18.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-store-assets
          path: artifacts
      - name: Verify and submit to the selected store
        env:
          STORE: ${{ matrix.store }}
          RELEASE_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          CHROME_PUBLISHER_ID: ${{ matrix.store == 'chrome' && vars.CHROME_PUBLISHER_ID || '' }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ matrix.store == 'chrome' && vars.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL || '' }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ matrix.store == 'chrome' && secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY || '' }}
          EDGE_PRODUCT_ID: ${{ matrix.store == 'edge' && vars.EDGE_PRODUCT_ID || '' }}
          EDGE_CLIENT_ID: ${{ matrix.store == 'edge' && vars.EDGE_CLIENT_ID || '' }}
          EDGE_API_KEY: ${{ matrix.store == 'edge' && secrets.EDGE_API_KEY || '' }}
          FIREFOX_JWT_ISSUER: ${{ matrix.store == 'firefox' && secrets.FIREFOX_JWT_ISSUER || '' }}
          FIREFOX_JWT_SECRET: ${{ matrix.store == 'firefox' && secrets.FIREFOX_JWT_SECRET || '' }}
        run: node scripts/submit-store.mjs
